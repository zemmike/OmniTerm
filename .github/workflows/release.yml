name: Release

# Tag a commit with e.g. `v1.0.0` and push the tag:
#   git tag v1.0.0 && git push origin v1.0.0
# This builds the Ubuntu/Debian installer plus portable builds and attaches them
# to a GitHub Release, so users can install with:
#   sudo apt install ./OmniTerm-1.0.0-amd64.deb
# A SHA256SUMS file covering every asset is published by the `checksums` job
# below, which install-linux.sh verifies before it installs anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on the artifacts (e.g. 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            targets: deb AppImage tar.gz rpm
          - arch: arm64
            targets: deb tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.vars.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node -p "require('./package.json').version"

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron runtime binary is present
        run: |
          if [ ! -x node_modules/electron/dist/electron ]; then
            node node_modules/electron/install.js
          fi

      - name: Build
        run: npm run build

      - name: Package for Linux
        run: npx electron-builder --linux ${{ matrix.targets }} --${{ matrix.arch }} --publish never

      - name: Verify the .deb installs
        if: matrix.arch == 'x64'
        run: |
          set -e
          DEB=$(ls release/*.deb | head -1)
          dpkg-deb --info "$DEB"
          sudo apt-get update
          sudo apt-get install -y "./$DEB"
          command -v omniterm
          dpkg -s omniterm | head -12

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: OmniTerm ${{ steps.vars.outputs.version }}
          generate_release_notes: true
          draft: false
          files: |
            release/*.deb
            release/*.AppImage
            release/*.rpm
            release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: omniterm-linux-${{ matrix.arch }}-${{ steps.vars.outputs.version }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.rpm
            release/*.tar.gz
          if-no-files-found: error

  # Both matrix legs publish assets, so the checksums have to be computed once,
  # afterwards, over everything the release actually carries — otherwise each leg
  # would write a partial SHA256SUMS and the last one would win.
  checksums:
    name: Publish SHA256SUMS
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download every published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sums
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir sums --clobber
          ls -l sums

      - name: Generate and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd sums
          rm -f SHA256SUMS
          # Bare file names with two spaces between the hash and the name: the
          # format `sha256sum -c` expects, and the name install-linux.sh greps
          # for when it verifies the .deb it is about to install.
          sha256sum *.deb *.AppImage *.rpm *.tar.gz > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Verify the published checksums against the published files
        run: |
          set -euo pipefail
          cd sums
          sha256sum -c SHA256SUMS
