version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      # Vite and its React plugin move together: plugin-react 6 requires vite ^8,
      # and this project pins vite ^6, so a lone bump of either one cannot even
      # install (npm ci fails with ERESOLVE). One PR, both, or neither.
      vite-toolchain:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
      # Minor and patch bumps arrive as one PR; a runtime major such as Electron
      # changes Chromium and the node-pty ABI, so it stays separate and gets the
      # packaging and .deb install checks on its own.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
