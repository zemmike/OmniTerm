name: Build native packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Build before testing: one API test asserts that a non-API path serves the SPA
      # shell, and that shell is served out of dist/. With no dist/ it correctly
      # returns 404, so running the suite first made CI fail on a missing build while
      # the same suite passed locally, where dist/ already existed.
      - run: npm run build
      - run: npm test
      - name: Action pins are commit SHAs
        run: bash scripts/check-action-pins.sh

  native:
    name: Native package (${{ matrix.name }})
    needs: portable
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            targets: deb AppImage tar.gz rpm
          - name: linux-arm64
            runner: ubuntu-latest
            platform: linux
            arch: arm64
            targets: deb tar.gz
          - name: macos
            runner: macos-14
            platform: mac
            arch: universal
            targets: dmg zip
          - name: windows-x64
            runner: windows-2025
            platform: windows
            arch: x64
            targets: nsis zip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # node-pty 1.1.0's npm tarball ships the Darwin spawn-helper as 0644.
      # macOS refuses to execute it and reports only "posix_spawnp failed".
      - name: Repair node-pty helper permission (macOS)
        if: matrix.platform == 'mac'
        run: chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper
      - name: Native PTY smoke (Unix)
        if: matrix.platform != 'windows'
        run: npm run test:pty
      - name: Native PTY smoke (Windows)
        if: matrix.platform == 'windows'
        run: npm run test:pty:windows
      - run: npm run build
      - name: Rebuild node-pty for Electron
        run: npm run rebuild:native
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux ${{ matrix.targets }} --${{ matrix.arch }} --publish never
      - name: Package macOS
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --mac --publish never 2>&1 | tee package.log
          code=$?
          if [ $code -ne 0 ]; then
            tail=$(tail -30 package.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=macOS packaging failed (exit $code)::$tail"
            exit $code
          fi
      # electron-builder's own output is the only diagnosis when this step fails, and the
      # job log needs repository admin rights to read. Fold the tail of it into a check
      # annotation, so a failure explains itself instead of reading as "exit code 1".
      - name: Package Windows
        if: matrix.platform == 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath package.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content package.log -Tail 30) -join "%0A"
            Write-Output "::error title=Windows packaging failed (exit $code)::$tail"
            exit $code
          }
      - name: Verify Linux package
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          DEB=$(find release -maxdepth 1 -name '*.deb' -print -quit)
          sudo apt-get update
          sudo apt-get install -y "./$DEB"
          command -v omniterm
          test -f /usr/share/applications/omniterm.desktop
      - name: Verify macOS package
        if: matrix.platform == 'mac'
        run: |
          ZIP=$(find release -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/omniterm-mac-smoke"
          APP=$(find "$RUNNER_TEMP/omniterm-mac-smoke" -name 'OmniTerm.app' -type d -print -quit)
          test -x "$APP/Contents/MacOS/OmniTerm"
          test -f "$APP/Contents/Info.plist"
          find release -maxdepth 1 -name '*.dmg' -print -quit | grep .
      - name: Verify Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'OmniTermSmoke'
          $result = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited $($result.ExitCode)" }
          $app = Join-Path $installDir 'OmniTerm.exe'
          if (-not (Test-Path $app)) { throw 'OmniTerm.exe was not installed' }
          # Electron is linked as a Windows GUI application, so PowerShell cannot
          # reliably capture process.stdout from `OmniTerm.exe --version`. Verify
          # the version resource embedded by electron-builder instead.
          $expectedVersion = (Get-Content package.json | ConvertFrom-Json).version
          $metadata = (Get-Item $app).VersionInfo
          if ($metadata.ProductName -ne 'OmniTerm' -or $metadata.ProductVersion -notlike "$expectedVersion*") {
            throw "Version check failed: product=$($metadata.ProductName) version=$($metadata.ProductVersion) expected=$expectedVersion"
          }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller not found' }
          $result = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exited $($result.ExitCode)" }
      - name: Upload native packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omniterm-${{ matrix.name }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.rpm
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14
