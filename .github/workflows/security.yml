name: Security

# Pull-request security gates: a secret scan over the commit range and a
# dependency review of whatever the PR adds. Both run inside the free tier for
# public repositories. Nothing here needs the repository's npm cache or a build,
# so the whole workflow is a couple of minutes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks walks the commits behind the PR, so it needs the history,
          # not just the merge commit.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Our config extends the default ruleset and allowlists .env.example.
          # Absolute because gitleaks resolves it from its own working
          # directory, not from the workflow file. GITLEAKS_CONFIG is a gitleaks
          # CLI option (priority 2, after --config); the action sets no --config
          # of its own, it just inherits this environment into the child
          # process.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.github/gitleaks.toml
          # Fork PRs get a read-only token, so commenting would fail on exactly
          # the PRs the scan matters most for.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The action defaults to failing on `low`, which would block ordinary
          # Dependabot churn on advisories with no reachable impact. Fail on
          # high and critical; lower severities still show up in the summary.
          fail-on-severity: high
