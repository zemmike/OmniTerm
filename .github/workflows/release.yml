name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the artifacts (for example 1.12.4)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            targets: deb AppImage tar.gz rpm
          - name: linux-arm64
            runner: ubuntu-latest
            platform: linux
            arch: arm64
            targets: deb tar.gz
          - name: macos
            runner: macos-14
            platform: mac
            arch: universal
            targets: dmg zip
          - name: windows-x64
            runner: windows-2025
            platform: windows
            arch: x64
            targets: nsis zip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve version (Unix)
        if: matrix.platform != 'windows'
        id: vars_unix
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve version (Windows)
        if: matrix.platform == 'windows'
        id: vars_windows
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Stamp package version
        env:
          RELEASE_VERSION: ${{ steps.vars_unix.outputs.version || steps.vars_windows.outputs.version }}
        run: node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.RELEASE_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: npm ci
      - name: Native PTY smoke (Unix)
        if: matrix.platform != 'windows'
        run: npm run test:pty
      - name: Native PTY smoke (Windows)
        if: matrix.platform == 'windows'
        run: npm run test:pty:windows
      - run: npm run build
      - name: Rebuild node-pty for Electron
        run: npm run rebuild:native
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux ${{ matrix.targets }} --${{ matrix.arch }} --publish never
      - name: Package macOS
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - name: Package Windows
        if: matrix.platform == 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omniterm-${{ matrix.name }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.rpm
            release/*.tar.gz
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  checksums:
    name: Publish release and SHA256SUMS
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: omniterm-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: OmniTerm ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload checksummed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omniterm-release
          path: release-assets/*
          if-no-files-found: error
