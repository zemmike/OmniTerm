<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#prompt)" stroke-width="9" opacity="0.75"/>

  <!-- title bar dots -->
  <circle cx="88" cy="96" r="11" fill="#f87171" opacity="0.85"/>
  <circle cx="126" cy="96" r="11" fill="#fbbf24" opacity="0.85"/>
  <circle cx="164" cy="96" r="11" fill="#4ade80" opacity="0.85"/>
  <line x1="88" y1="132" x2="424" y2="132" stroke="url(#prompt)" stroke-width="6" opacity="0.35" stroke-linecap="round"/>

  <!-- chevron + underscore -->
  <path d="M118 214 L178 268 L118 322" fill="none" stroke="url(#prompt)" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M206 322 H300 C326 322 340 336 348 350" fill="none" stroke="url(#prompt)" stroke-width="30"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- circuit lines -->
  <path d="M120 388 H180" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <path d="M204 388 H264" stroke="#4ade80" stroke-width="14" stroke-linecap="round" opacity="0.3"/>
  <path d="M288 388 H392" stroke="#818cf8" stroke-width="14" stroke-linecap="round" opacity="0.2"/>
</svg>
